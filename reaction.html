<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chaos Arcade - Reaction Rush</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .reactionGame {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        .reactionStats {
            display: flex;
            justify-content: space-between;
            background: #20202d;
            padding: 15px 25px;
            border-radius: 15px;
            margin: 25px 0;
        }

        #reactionArea {
            height: 430px;
            border-radius: 25px;
            background: #242435;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        #reactionArea.waiting {
            background: #d83b3b;
        }

        #reactionArea.ready {
            background: #28c76f;
        }

        #reactionMessage {
            text-align: center;
        }

        .bigEmoji {
            font-size: 80px;
            margin-bottom: 15px;
        }

        #reactionMessage h2 {
            font-size: 32px;
        }

        #reactionMessage p {
            margin-top: 10px;
            color: #ddd;
        }

        .result {
            min-height: 40px;
            margin: 20px;
            color: #ffd166;
            font-size: 22px;
        }
    </style>
</head>

<body>

<div class="game">

    <div class="top">

        <h1>⚡ REACTION RUSH</h1>

        <p>
            Wait for GREEN... then CLICK! 👀
        </p>

    </div>


    <div class="reactionGame">

        <div class="reactionStats">

            <span>
                🏆 Best:
                <b id="best">--</b>
            </span>

            <span>
                🎮 Attempts:
                <b id="attempts">0</b>
            </span>

        </div>


        <div id="reactionArea">

            <div id="reactionMessage">

                <div class="bigEmoji">
                    ⚡
                </div>

                <h2>
                    Think you're fast?
                </h2>

                <p>
                    Click START and wait for GREEN!
                </p>

                <br>

                <button onclick="startGame(event)">
                    START GAME
                </button>

            </div>

        </div>


        <div id="result" class="result"></div>


        <button onclick="location.href='index.html'">
            🏠 BACK TO ARCADE
        </button>

    </div>

</div>


<script>

let startTime;

let timer;

let gameRunning = false;

let attempts = 0;

let bestScore =
    localStorage.getItem("bestReaction");


if (bestScore) {

    document.getElementById("best").innerText =
        bestScore + " ms";

}


function startGame(event) {

    // Prevent button click from becoming
    // an accidental game click
    if (event) {
        event.stopPropagation();
    }


    const area =
        document.getElementById("reactionArea");

    const message =
        document.getElementById("reactionMessage");


    attempts++;

    document.getElementById("attempts").innerText =
        attempts;


    gameRunning = false;


    area.className =
        "waiting";


    message.innerHTML = `

        <div class="bigEmoji">
            🔴
        </div>

        <h2>
            WAIT...
        </h2>

        <p>
            DON'T CLICK YET! 👀
        </p>

    `;


    let randomTime =
        Math.floor(Math.random() * 3000) + 2000;


    timer = setTimeout(() => {

        gameRunning = true;

        startTime = Date.now();


        area.className =
            "ready";


        message.innerHTML = `

            <div class="bigEmoji">
                🟢
            </div>

            <h2>
                CLICK NOW!!!
            </h2>

            <p>
                GO GO GO!!! ⚡
            </p>

        `;


    }, randomTime);

}


document
    .getElementById("reactionArea")
    .addEventListener("click", function () {


        // Clicked too early

        if (!gameRunning) {

            clearTimeout(timer);

            this.className = "";


            document
                .getElementById("reactionMessage")
                .innerHTML = `

                <div class="bigEmoji">
                    💀
                </div>

                <h2>
                    TOO EARLY!
                </h2>

                <p>
                    I literally said WAIT 😭
                </p>

                <br>

                <button onclick="startGame(event)">
                    TRY AGAIN
                </button>

            `;

            return;

        }


        // Calculate reaction

        const reactionTime =
            Date.now() - startTime;


        gameRunning = false;

        this.className = "";


        let comment;


        if (reactionTime < 200) {

            comment =
                "⚡ HUMAN FLASH!";

        }

        else if (reactionTime < 300) {

            comment =
                "🔥 THAT WAS FAST!";

        }

        else if (reactionTime < 500) {

            comment =
                "😎 NOT BAD!";

        }

        else if (reactionTime < 800) {

            comment =
                "😂 YOUR BRAIN WAS BUFFERING!";

        }

        else {

            comment =
                "🐢 EVEN A TURTLE IS FASTER!";

        }


        document
            .getElementById("reactionMessage")
            .innerHTML = `

            <div class="bigEmoji">
                🎉
            </div>

            <h2>
                ${reactionTime} ms
            </h2>

            <p>
                ${comment}
            </p>

            <br>

            <button onclick="startGame(event)">
                PLAY AGAIN
            </button>

        `;


        document
            .getElementById("result")
            .innerText =
            "🏆 Your reaction: " +
            reactionTime +
            " ms";


        // Save best score

        if (
            !bestScore ||
            reactionTime < Number(bestScore)
        ) {

            bestScore =
                reactionTime;


            localStorage.setItem(
                "bestReaction",
                reactionTime
            );


            document
                .getElementById("best")
                .innerText =
                reactionTime + " ms";

        }

    });

</script>

</body>

</html>
